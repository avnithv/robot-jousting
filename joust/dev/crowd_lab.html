<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crowd lab</title>
<style>
  body { margin: 0; padding: 24px; background: #1b1712; color: #e8dcc4; font: 14px/1.5 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; } p { margin: 0 0 16px; color: #a89a80; }
  section { margin: 0 0 18px; } h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #a89a80; margin: 0 0 6px; }
  button { background: #3a2f22; color: #f0e6d0; border: 1px solid #5c4a34; border-radius: 6px; padding: 8px 14px; margin: 0 6px 6px 0; font: inherit; cursor: pointer; }
  button:hover { background: #4a3c2b; } button.on { background: #7a5a2a; border-color: #b08a48; }
  input[type=range] { width: 260px; vertical-align: middle; } label { margin-right: 18px; } code { color: #d9b46a; }
  #meter { display: inline-block; width: 320px; height: 14px; background: #2a231b; border: 1px solid #5c4a34; vertical-align: middle; position: relative; }
  #meter i { position: absolute; left: 0; top: 0; bottom: 0; background: #b08a48; } #meter b { position: absolute; top: 0; bottom: 0; width: 2px; background: #f0e6d0; }
  #status { color: #a89a80; font-family: ui-monospace, monospace; font-size: 12px; }
</style>
</head>
<body>
<h1>crowd lab</h1>
<p>Procedural crowd + arena bed from <code>src/audio/crowd.js</code>. Start needs a click (audio context).</p>
<section>
  <button id="start">start</button><button id="stop">stop</button><button id="duck">duck 90ms</button><button id="demo">demo turn</button>
  <span id="status">stopped</span>
</section>
<section>
  <h2>bed</h2>
  <label>energy <input id="energy" type="range" min="0" max="1" step="0.01" value="0.3"> <span id="energyv">0.30</span></label>
  <label>intensity <input id="intensity" type="range" min="0.2" max="2" step="0.05" value="1"> <span id="intensityv">1.00</span></label>
</section>
<section>
  <h2>reactions</h2>
  <div id="reactions"></div>
</section>
<section>
  <h2>crowd output (pre amb bus)</h2>
  <div id="meter"><i></i><b></b></div> <span id="meterv">-inf dB</span>
</section>
<script type="module" src="crowd_lab.js"></script>
</body>
</html>
